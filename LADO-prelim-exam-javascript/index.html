<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Simple Prompt Calculator</title>
		<style>
			body { font-family: Arial, Helvetica, sans-serif; padding: 20px; }
			#results { margin-top: 20px; }
			.entry { padding: 8px; border-bottom: 1px solid #eee; }
			.entry strong { display: inline-block; width: 80px; }
		</style>
	</head>
	<body>
		<h1>Simple Calculator (prompt-based)</h1>
		<p>Click the button below to start. The calculator will ask for two numbers and an operation.</p>
		<button id="startBtn">Start Calculator</button>

		<div id="results">
			<h2>Result</h2>
			<div id="history"></div>
		</div>

		<script src="script.js"></script>
	</body>
</html>
