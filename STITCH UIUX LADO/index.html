<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Four Images</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 1000px; margin: 20px auto; text-align: center; }
    .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .gallery img { width: 100%; height: auto; border: 1px solid #ddd; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>crud system</h1>
  <p>create, read, update, and delete images</p>

  <div class="gallery">
    <img src="images/create.png" alt="Image 1" />
    <img src="images/read.png" alt="Image 2" />
    <img src="images/update.png" alt="Image 3" />
    <img src="images/delete.png" alt="Image 4" />
  </div>

  
</body>
</html>
